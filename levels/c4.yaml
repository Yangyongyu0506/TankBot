schema_version: '1.0'
metadata:
  id: c4
  name: C4 · 从极坐标滤波到自动瞄准
  description: 沿用 C3 的底盘中心 Radar 与差速巡逻敌车，复用滤波器，预测命中点并用程序控制炮台角加速度和开火。
  chapter:
    chapter_id: weapons
    title: Weapons
    description: 锁定底盘，依次学习坐标变换、目标跟踪、自瞄和装甲瞄准。
  order: 4
  version: 4.0.0
  learning_objectives:
  - 复用 C3 极坐标滤波，分文件实现中心运动预测、炮台角加速度闭环与自动开火。
  recommended_algorithms: []
  prerequisites:
  - c3
world:
  dimension: 2
  frame_id: map
  simulation:
    physics_hz: 60
    substeps: 4
    sensor_hz: 30
    algorithm_hz: 10
  map:
    source: inline
    walls:
    - center:
      - 6.1
      - 0.0
      size:
      - 0.2
      - 8.4
    - center:
      - -6.1
      - 0.0
      size:
      - 0.2
      - 8.4
    - center:
      - 0.0
      - 4.1
      size:
      - 12.0
      - 0.2
    - center:
      - 0.0
      - -4.1
      size:
      - 12.0
      - 0.2
    - center:
      - 2.0
      - 0.0
      size:
      - 0.2
      - 3.0
robots:
- id: player
  type: tank
  role: player
  model: scene_selected
  initial_pose:
  - 0.0
  - 0.0
  - 0.0
  initial_velocity:
  - 0.0
  - 0.0
  - 0.0
  health:
    max_hp: 3
    damage_per_hit: 1
    collision_damage: 0
    death_behavior: remove_at_substep_end
  control_sources:
    chassis: disabled
    turret: robot
    weapon: robot
  sensors:
  - type: wheel_encoder
    topic: /robot/sensors/joint_states
    schema: joint_state@1
    frame_id: base_link
    update_hz: 30
  - type: imu
    topic: /robot/sensors/imu
    schema: imu@1
    frame_id: base_link
    update_hz: 30
  - type: turret_joint
    topic: /robot/turret/joint_states
    schema: joint_state@1
    frame_id: base_link
    update_hz: 30
  - type: weapon_state
    topic: /robot/weapons/cannon/state
    schema: weapon_state@1
    frame_id: base_link
    update_hz: 30
  - type: radar
    topic: /robot/sensors/radar
    schema: radar@1
    frame_id: radar_link
    update_hz: 10
    parameters:
      mount_m:
      - 0.0
      - 0.0
      yaw_rad: 0.0
      frame_id: radar_link
      range_m: 12.0
      field_of_view_rad: 6.283185307179586
      update_hz: 10
      occlusion: walls
      measurement: target_center
      latency_ticks: 0
      range_bias_m: 0.0
      bearing_bias_rad: 0.0
      noise:
        range_stddev_m: 0.45
        bearing_stddev_rad: 0.08
        drop_probability: 0.1
- id: patrol_enemy
  type: patrol_tank
  role: target
  initial_pose:
  - -4.5
  - -2.0
  - 0.0
  parameters:
    motion:
      chassis: differential
      initial_velocity:
      - 0.0
      - 0.0
      - 0.0
      initial_turret_angle_rad: 0.0
      initial_turret_rate_radps: 0.0
      control_hz: 10
      waypoints_m:
      - - -1.5
        - -2.0
      - - -1.5
        - 2.0
      - - -4.5
        - 2.0
      - - -4.5
        - -2.0
      forward_speed_mps: 0.6
      heading_gain_per_s: 2.0
      max_yaw_rate_radps: 1.5
      turn_in_place_threshold_rad: 0.35
      arrival_radius_m: 0.25
    health:
      max_hp: 3
      damage_per_hit: 1
      collision_damage: 0
      death_behavior: remove_at_substep_end
communication:
  runtime:
    template_version: 5.0.0
    manifest:
      manifest_version: '1.0'
      sdk_version: 0.1.0
      protocol_version: '1.0'
      project_id: weapons-robot
      entry_point: robot_modules.observations:PolarTrackingModule
      modules:
      - module_id: tracking
        contract: contracts/tracking.json
        config: {}
      - module_id: aiming
        contract: contracts/aiming.json
        config: {}
      connections:
      - from: /robot/localization/pose
        to: tracking.self_pose
      - from: /robot/sensors/radar
        to: tracking.radar
      - from: tracking.target
        to: /robot/estimates/tracking/target_polar
      - from: /robot/localization/pose
        to: aiming.self_pose
      - from: /robot/turret/joint_states
        to: aiming.turret
      - from: /robot/weapons/cannon/state
        to: aiming.weapon
      - from: /robot/estimates/tracking/target_polar
        to: aiming.target
      - from: aiming.acceleration
        to: /robot/turret/cmd_accel
      - from: aiming.fire
        to: /robot/weapons/cannon/fire
      dependencies: []
      pose_source:
        mode: system
        module_id: null
        fallback: none
    contracts:
      tracking:
        contract_version: '1.0'
        module_id: tracking
        entry_point: robot_modules.observations:PolarTrackingModule
        inputs:
          self_pose:
            schema: pose2d@1
            required: true
            max_age_ticks: 24
          radar:
            schema: radar@1
            required: true
            max_age_ticks: 24
        outputs:
          target:
            schema: target_polar_estimate@1
        execution:
          mode: periodic
          period_ticks: 6
          deadline_ticks: 6
          budget_ms: 6
        dependencies: []
        state_version: '1'
      aiming:
        contract_version: '1.0'
        module_id: aiming
        entry_point: robot_modules.aiming:PredictiveAimingModule
        inputs:
          self_pose:
            schema: pose2d@1
            required: true
            max_age_ticks: 24
          turret:
            schema: joint_state@1
            required: true
            max_age_ticks: 24
          weapon:
            schema: weapon_state@1
            required: true
            max_age_ticks: 24
          target:
            schema: target_polar_estimate@1
            required: false
            max_age_ticks: 24
        outputs:
          acceleration:
            schema: turret_acceleration@1
          fire:
            schema: fire_command@1
        execution:
          mode: periodic
          period_ticks: 6
          deadline_ticks: 6
          budget_ms: 6
        dependencies:
        - tracking
        state_version: '1'
    target_source: tracking
    managed_files:
    - tankbot.json
    - robot_modules/observations.py
    - contracts/tracking.json
    - tests/test_polar_contract.py
    - robot_modules/aiming.py
    - contracts/aiming.json
    - tests/test_prediction_contract.py
    mode: graph
    profile_id: weapons_polar_aiming
    logical_module:
      module_id: perception
      entry_point: campaign_robot:CampaignRobot
    processing: modules
permissions:
  data_access:
    inputs:
      /robot/localization/pose: pose2d@1
      /robot/sensors/radar: radar@1
      /robot/turret/joint_states: joint_state@1
      /robot/weapons/cannon/state: weapon_state@1
    outputs:
    - target_polar_estimate@1
    actuators:
      /robot/turret/cmd_accel: turret_acceleration@1
      /robot/weapons/cannon/fire: fire_command@1
  visualization:
    view_policy:
      policy_id: campaign-c4
      system_pose_allowed: true
      player_pose_allowed: false
      allowed_pose_frames:
      - map
      public_map: m1-test-map
      local_observation_channels:
      - /robot/sensors/joint_states
      - /robot/sensors/imu
      - /robot/turret/joint_states
      - /robot/weapons/cannon/state
      - /robot/sensors/radar
      true_enemy_objects: false
      world_effects: true
      camera_source: selected_pose_or_manual
      pose_fresh_ticks: 12
      pose_hide_after_ticks: 60
      robot_topics_allowed: true
      target_estimates_allowed: true
    allowed_layers:
    - map
    - robot
    - trail
    - target_estimates
    - radar
    - imu
    - encoders
    - turret
    - projectiles
    - frames
  public_initial_pose: true
  public_map: true
visualization:
  initial_enabled:
  - map
  - robot
  - trail
  - target_estimates
  - radar
  - imu
  - encoders
  - turret
  - projectiles
  user_toggleable:
  - map
  - robot
  - trail
  - target_estimates
  - radar
  - imu
  - encoders
  - turret
  - projectiles
  - frames
  sources:
    map: map
    robot: selected_pose
    trail: selected_pose
    target_estimates: player_estimate
    radar: local_observation
    imu: local_observation
    encoders: local_observation
    turret: local_observation
    projectiles: authorized_truth
    frames: selected_pose
  preserve_user_settings: true
objectives:
  parameters:
    movement_m: 0.0
    turn_rad: 0.0
    required_hits: 0
    required_estimates: 0
  progress:
    moved:
      type: displacement
      parameter: movement_m
      sticky: true
    turned:
      type: heading_change
      parameter: turn_rad
      sticky: true
  success:
    type: compare
    metric: target_alive
    operator: ==
    value: false
  outcomes:
  - reason: player_dead
    result: failure
    when:
      type: compare
      metric: player_alive
      operator: ==
      value: false
  - reason: objective_completed
    result: success
    when:
      type: all
      conditions:
      - type: compare
        metric: objective_complete
        operator: ==
        value: true
      - type: compare
        metric: elapsed_ticks
        operator: <=
        parameter: limit_ticks
  - reason: timeout
    result: failure
    when:
      type: compare
      metric: elapsed_ticks
      operator: '>='
      parameter: limit_ticks
  time_limit_s: 120
  timer_start: first_deployment
  target: patrol_enemy
evaluation:
  type: terminal_diagnostics
  publish_on: terminal
  metrics:
  - id: rmse_m
    type: position_rmse
  - id: yaw_rmse_rad
    type: yaw_rmse
randomization:
  seed: 0
  reset_on: new_run
  generator: python_random_v1
tutorial:
  problem: 沿用 C3 的底盘中心 Radar 与差速巡逻敌车，复用滤波器，预测命中点并用程序控制炮台角加速度和开火。
  hints:
  - 复用 C3 极坐标滤波，分文件实现中心运动预测、炮台角加速度闭环与自动开火。
  - F2 文件树高亮本关主要编辑文件；已有 perception/、weapons/ 源码和历史版本保留。
  - 运行中主界面可看日志，修改前请结束或重置本次尝试。
  lesson:
    title: C4 · 从极坐标滤波到自动瞄准
    summary: 复用 C3 极坐标滤波，分文件实现中心运动预测、炮台角加速度闭环与自动开火。
    steps:
    - 沿用 C3：自身位姿由系统提供、底盘锁定，敌车为相同差速巡逻模型；只观测底盘中心 Radar，没有 GPS 或装甲观测。
    - 直接复用 perception/polar_tracker.py；输入为 tuple[PolarTargetEstimate, ...]，输入输出与 C3
      完全相同，返回当前采样时刻的车体系 PolarTargetEstimate。
    - 实现 weapons/target_prediction.py：从滤波结果估计中心速度，补偿 target_age_s 和弹丸飞行时间，返回当前我方车体系的预测中心
      [r,theta]。
    - 实现 weapons/auto_aim.py：使用环绕角误差和角速度反馈控制炮台加速、制动，并根据跟随误差与 weapon_ready 决定开火。只能控制相对角加速度，不能直接设置角度/速度。
    - 保存、测试、部署后，炮台和开火全部由程序控制，人工 J/L/空格与手柄武器输入禁用；无需估计敌车 yaw，也不要求命中装甲。
    - 复用 C3 的存活击杀条件和 120 秒时限；C5 再加入匿名装甲关联、有效装甲命中和全向小陀螺预测。
    files:
    - path: perception/polar_tracker.py
      role: 复用 C3：原始极坐标滤波，不更改函数签名。
    - path: weapons/target_prediction.py
      role: 本关填写：中心速度与弹丸提前量预测。
    - path: weapons/auto_aim.py
      role: 本关填写：角加速度闭环、制动与开火条件。
    default_type: PolarTargetEstimate
    functions:
    - path: perception/polar_tracker.py
      name: update
    - path: weapons/target_prediction.py
      name: update
    - path: weapons/auto_aim.py
      name: update
    aliases:
      own_pose: ndarray
      measurements: tuple[PolarTargetEstimate, ...]
    completion: 首次成功部署后计时，限时 {time_limit_s} 仿真秒，双方 {max_hp} HP。存活并击杀敌车通关；玩家死亡或超时失败，主动结束后可编辑。运行中不公开目标真值误差。
    common_errors:
    - 不要把 range/bearing 当作地图 x/y；角度创新须归一到 [-pi,pi)。
    - 观测元组只有当前帧，不是历史；需要保留状态或窗口时必须限制大小。
    - 运行阶段不能打开编辑器；请先结束本次尝试，修改保存后重试。
    - target_yaw_rad 为 None：本关只需预测中心；armor_mounts 是 shape=(0,3) 的空数组。
    - 零角加速度并非停转；无目标时返回 None，并在控制器中主动制动、禁止盲目开火。
    - target_age_s 已含等待提交时延；有界记录跨帧状态，不要无限追加历史。
    - 输入是 tuple[PolarTargetEstimate, ...]：用 .range_m/.bearing_rad 取值，空帧为 ()；不要使用旧
      measurements_rt 的二维下标。
    execution: 框架以 {algorithm_hz} Hz 提供同期 tuple[PolarTargetEstimate, ...] 观测。Radar
      距离 σ={range_stddev_m:g} m、方位 σ={bearing_stddev_rad:g} rad、独立丢失 {drop_probability:.0%}；dt
      是仿真秒。空元组 () 为当前帧缺测，内部状态跨调用保存，部署或重试重新初始化。
    calibration:
      radar_measurement_covariance:
        source: radar_covariance
      projectile_speed_mps:
        source: projectile_speed_mps
      max_acceleration_radps2:
        source: max_acceleration_radps2
      enemy_drive_model:
        source: target_drive_model
    type_notes:
      PolarTargetEstimate:
        description: C3/C4 复用的车体系距离/方位值类型：输入 tuple 中是当前原始带噪测量，函数返回值是玩家滤波/预测后的估计。
        fields:
          range_m: 距离，float，m，非负；输入为测量，输出为估计。
          bearing_rad: 相对当前我方车头的方位，float，rad，范围 [-pi,pi)。
          covariance: 输入为 None；输出为 None 或只读 (2,2) NumPy 协方差，顺序 r/theta。
    ui:
      state_heading: 02 / AUTHORIZED SELF POSE
      legend_pose: 系统自定位
      view_note: 系统提供自身位姿和可见炮弹；敌车位置来自 Python 的估计。雷达图仅显示车体系观测。炮弹图层可在设置中切换。
      mode_label: 教学视图 · 系统自定位 / 玩家目标估计
      freshness_message: 系统提供自身位姿和可见炮弹；敌车只有玩家目标估计
      progress_layout: health
      default_file: weapons/target_prediction.py
    edit_files:
    - perception/polar_tracker.py
    - weapons/target_prediction.py
    - weapons/auto_aim.py
  testing:
    checks:
    - Python 语法与导入；项目接口、连线和发布权限。
    - tests/test_*.py 中的项目单元测试；默认检查空观测、类型与基本数值契约，可自行补充算法样例。
    - 使用获授权传感器输入试运行 {test_batches} 个批次，检查异常、超时和输出消息。
    meaning: 通过表示此快照可以加载并通过这些样例和短时间试运行，不代表算法效果完美或关卡通关。测试输出不会控制坦克，也不会进入正式画面。
scaffolding:
  components:
  - polar_tracker
  - raw_sensor_adapters
  - polar_contract_tests
  - predictive_aiming_adapter
  - polar_auto_aim
  - target_prediction
  - predictive_contract_tests
  documentation:
    perception/polar_tracker.py:
    - function: update
      text: '输入 measurements: tuple[PolarTargetEstimate, ...]，当前帧敌车中心的原始极坐标观测集合，当前长度为
        0 或 1；缺测为 ()，不是 NumPy 数组，也不是历史缓存。与 C2 的 tuple[TargetEstimate, ...] 结构相同，字段改为距离和方位。

        每个 measurement 的 range_m: float 为距离（m），bearing_rad: float 为相对我方车头的方位（rad），均在当前我方
        base_link；输入 covariance 为 None，measurement_covariance 构造参数仍提供 YAML 中的 (2,2)
        测量噪声矩阵。输入对象复用 PolarTargetEstimate 类型，但仍是未滤波的雷达观测，不是系统替你计算的估计。

        own_pose: shape=(3,) 的公开自身 [x_m,y_m,yaw_rad] NumPy 数组；dt: float 为仿真秒。

        返回 PolarTargetEstimate(range_m: float,bearing_rad: float,covariance=None)
        或 None。输出仍在当前车体系，bearing 归一到 [-pi,pi)，covariance 为 None 或 (2,2) NumPy 矩阵，顺序
        r/theta。

        读取示例：measurement: PolarTargetEstimate = measurements[0]；r: float = measurement.range_m；theta:
        float = measurement.bearing_rad。读取前先判断 if measurements，缺测时可以只预测。

        内部可以保存 NumPy 状态 [x,y,vx,vy]，观测模型使用 hypot/atan2，推导 Jacobian、环绕角度创新并更新协方差；框架不先转换为地图
        x/y，不强制唯一算法。

        从旧数组接口迁移：将原来的 measurements_rt[0,0] / measurements_rt[0,1] 改为 measurements[0].range_m
        / measurements[0].bearing_rad。如需矩阵，可自行使用 np.array([[m.range_m,m.bearing_rad]
        for m in measurements],dtype=np.float64).reshape((-1,2))。升级只更新管理脚手架，已有算法文件不覆盖；请按新签名自行适配后重新测试。'
    weapons/target_prediction.py:
    - function: update
      text: 'observation: AimInput；target_rt 是只读 shape=(2,) NumPy 数组 [range_m,bearing_rad]，单位
        m/rad，参考系为当前我方 base_link；无合法目标时为 None。target_xy 是地图系中心估计，own_pose 为当前公开自身
        [x,y,yaw]；target_age_s 是估计采样到控制提交的仿真秒数。

        返回 np.ndarray([range_m,bearing_rad],dtype=np.float64)，shape=(2,)，表示弹丸到达时的预测中心在当前我方车体系的位置；或
        None 表示暂不瞄准/开火。

        构造参数 projectile_speed_mps 是公开弹速；本关 armor_mounts 为 shape=(0,3) 空矩阵，target_yaw_rad
        为 None，不需要估计敌车朝向或选择装甲。

        从有界多帧中心状态估计速度，结合观测时延、弹丸飞行时间预测提前量；dt 为仿真秒。不要把同一采样 tick 的重复输入当新测量；不应重复补偿已包含的时延。框架只转换坐标，不替玩家滤波或预测。'
    weapons/auto_aim.py:
    - function: update
      text: 'observation.target_rt: None 或只读 shape=(2,) NumPy 数组 [range_m,bearing_rad]，已经由本关
        target_prediction.py 转为预测瞄准点，参考系为当前我方 base_link。

        observation.turret_angle_rad / turret_rate_radps: 炮台相对底盘的连续角与角速度，单位 rad、rad/s；dt:
        float 仿真秒。

        返回 AimOutput(acceleration_radps2: float,fire: bool)。只能控制相对角加速度，不能直接设置角度或速度。使用
        bearing 与炮台角的环绕误差，并结合角速度反馈实现加速/制动；零加速度不等于停转。

        开火需要考虑指向误差、跟随误差和 weapon_ready；框架负责限幅、看门狗、冷却与幂等请求。C0-C3 的人工武器控制在本关撤销；C5 继续复用本控制器。

        为兼容旧项目，AimInput.target_xy（地图系）和 own_pose 仍可读；新控制器可直接用 target_rt，不必再次处理全局坐标。'
