schema_version: '1.0'
metadata:
  id: c4
  name: C4 · 拦截车头 GPS，融合敌车位姿
  description: 截获敌车车头 GPS 的地图系 x/y，同时获得底盘中心的车体系 Radar (r,theta)。联合估计敌车中心与 yaw，人工瞄准有效装甲。
  chapter:
    chapter_id: weapons
    title: Weapons
    description: 锁定底盘，依次学习坐标变换、目标跟踪、自瞄和装甲瞄准。
  order: 4
  version: 2.0.0
  learning_objectives:
  - 融合不同坐标系与不同安装点的观测，估计敌车 x/y/yaw，并理解装甲安装几何。
  recommended_algorithms: []
  prerequisites:
  - c3
world:
  dimension: 2
  frame_id: map
  simulation:
    physics_hz: 60
    substeps: 4
    sensor_hz: 30
    algorithm_hz: 10
  map:
    source: inline
    walls:
    - center:
      - 6.1
      - 0.0
      size:
      - 0.2
      - 8.4
    - center:
      - -6.1
      - 0.0
      size:
      - 0.2
      - 8.4
    - center:
      - 0.0
      - 4.1
      size:
      - 12.0
      - 0.2
    - center:
      - 0.0
      - -4.1
      size:
      - 12.0
      - 0.2
    - center:
      - 2.0
      - 0.0
      size:
      - 0.2
      - 3.0
robots:
- id: player
  type: tank
  role: player
  model: scene_selected
  initial_pose:
  - 0.0
  - 0.0
  - 0.0
  initial_velocity:
  - 0.0
  - 0.0
  - 0.0
  health:
    max_hp: 3
    damage_per_hit: 1
    collision_damage: 0
    death_behavior: remove_at_substep_end
  control_sources:
    chassis: disabled
    turret: keyboard
    weapon: keyboard
  sensors:
  - type: wheel_encoder
    topic: /robot/sensors/joint_states
    schema: joint_state@1
    frame_id: base_link
    update_hz: 30
  - type: imu
    topic: /robot/sensors/imu
    schema: imu@1
    frame_id: base_link
    update_hz: 30
  - type: turret_joint
    topic: /robot/turret/joint_states
    schema: joint_state@1
    frame_id: base_link
    update_hz: 30
  - type: weapon_state
    topic: /robot/weapons/cannon/state
    schema: weapon_state@1
    frame_id: base_link
    update_hz: 30
  - type: radar
    topic: /robot/sensors/radar
    schema: radar@1
    frame_id: radar_link
    update_hz: 10
    parameters:
      mount_m:
      - 0.0
      - 0.0
      yaw_rad: 0.0
      frame_id: radar_link
      range_m: 12.0
      field_of_view_rad: 6.283185307179586
      update_hz: 10
      occlusion: walls
      measurement: target_center
      latency_ticks: 0
      range_bias_m: 0.0
      bearing_bias_rad: 0.0
      noise:
        range_stddev_m: 0.45
        bearing_stddev_rad: 0.08
        drop_probability: 0.1
  - type: intercepted_gps
    topic: /robot/sensors/intercepted_gps
    schema: gps_fix@1
    frame_id: map
    update_hz: 10
    parameters:
      target_robot: patrol_enemy
      mount: front_center
      range_m: 12.0
      occlusion: none
      latency_ticks: 0
      bias_m:
      - 0.0
      - 0.0
      random_stream: intercepted_front_gps
      noise:
        position_stddev_m: 0.15
        drop_probability: 0.1
- id: patrol_enemy
  type: patrol_tank
  role: target
  initial_pose:
  - -4.5
  - -2.0
  - 0.0
  parameters:
    motion:
      chassis: differential
      initial_velocity:
      - 0.0
      - 0.0
      - 0.0
      initial_turret_angle_rad: 0.0
      initial_turret_rate_radps: 0.0
      control_hz: 10
      waypoints_m:
      - - -1.5
        - -2.0
      - - -1.5
        - 2.0
      - - -4.5
        - 2.0
      - - -4.5
        - -2.0
      forward_speed_mps: 0.6
      heading_gain_per_s: 2.0
      max_yaw_rate_radps: 1.5
      turn_in_place_threshold_rad: 0.35
      arrival_radius_m: 0.25
    health:
      max_hp: 3
      damage_per_hit: 1
      collision_damage: 0
      death_behavior: remove_at_substep_end
    armor:
      source: chassis_profile
communication:
  runtime:
    template_version: 3.0.0
    manifest:
      manifest_version: '1.0'
      sdk_version: 0.1.0
      protocol_version: '1.0'
      project_id: weapons-robot
      entry_point: robot_modules.observations:FusionTrackingModule
      modules:
      - module_id: tracking
        contract: contracts/tracking.json
        config: {}
      connections:
      - from: /robot/localization/pose
        to: tracking.self_pose
      - from: /robot/sensors/radar
        to: tracking.radar
      - from: /robot/sensors/intercepted_gps
        to: tracking.gps
      - from: tracking.target
        to: /robot/estimates/tracking/target_pose
      dependencies: []
      pose_source:
        mode: system
        module_id: null
        fallback: none
    contracts:
      tracking:
        contract_version: '1.0'
        module_id: tracking
        entry_point: robot_modules.observations:FusionTrackingModule
        inputs:
          self_pose:
            schema: pose2d@1
            required: true
            max_age_ticks: 24
          radar:
            schema: radar@1
            required: true
            max_age_ticks: 24
          gps:
            schema: gps_fix@1
            required: true
            max_age_ticks: 24
        outputs:
          target:
            schema: target_pose_estimate@1
        execution:
          mode: periodic
          period_ticks: 6
          deadline_ticks: 6
          budget_ms: 6
        dependencies: []
        state_version: '1'
    target_source: tracking
    managed_files:
    - tankbot.json
    - robot_modules/observations.py
    - contracts/tracking.json
    - tests/test_polar_contract.py
    - tests/test_fusion_contract.py
    mode: graph
    profile_id: weapons_fusion
    logical_module:
      module_id: perception
      entry_point: campaign_robot:CampaignRobot
    processing: modules
permissions:
  data_access:
    inputs:
      /robot/localization/pose: pose2d@1
      /robot/sensors/radar: radar@1
      /robot/turret/joint_states: joint_state@1
      /robot/weapons/cannon/state: weapon_state@1
      /robot/sensors/intercepted_gps: gps_fix@1
    outputs:
    - target_pose_estimate@1
    actuators: {}
  visualization:
    view_policy:
      policy_id: campaign-c4
      system_pose_allowed: true
      player_pose_allowed: false
      allowed_pose_frames:
      - map
      public_map: m1-test-map
      local_observation_channels:
      - /robot/sensors/joint_states
      - /robot/sensors/imu
      - /robot/turret/joint_states
      - /robot/weapons/cannon/state
      - /robot/sensors/radar
      - /robot/sensors/intercepted_gps
      true_enemy_objects: false
      world_effects: true
      camera_source: selected_pose_or_manual
      pose_fresh_ticks: 12
      pose_hide_after_ticks: 60
      robot_topics_allowed: true
      target_estimates_allowed: true
    allowed_layers:
    - map
    - robot
    - trail
    - target_estimates
    - radar
    - imu
    - encoders
    - turret
    - projectiles
    - frames
  public_initial_pose: true
  public_map: true
visualization:
  initial_enabled:
  - map
  - robot
  - trail
  - target_estimates
  - radar
  - imu
  - encoders
  - turret
  - projectiles
  user_toggleable:
  - map
  - robot
  - trail
  - target_estimates
  - radar
  - imu
  - encoders
  - turret
  - projectiles
  - frames
  sources:
    map: map
    robot: selected_pose
    trail: selected_pose
    target_estimates: player_estimate
    radar: local_observation
    imu: local_observation
    encoders: local_observation
    turret: local_observation
    projectiles: authorized_truth
    frames: selected_pose
  preserve_user_settings: true
objectives:
  parameters:
    movement_m: 0.0
    turn_rad: 0.0
    required_hits: 0
    required_estimates: 0
  progress:
    moved:
      type: displacement
      parameter: movement_m
      sticky: true
    turned:
      type: heading_change
      parameter: turn_rad
      sticky: true
  success:
    type: compare
    metric: target_alive
    operator: ==
    value: false
  outcomes:
  - reason: player_dead
    result: failure
    when:
      type: compare
      metric: player_alive
      operator: ==
      value: false
  - reason: objective_completed
    result: success
    when:
      type: all
      conditions:
      - type: compare
        metric: objective_complete
        operator: ==
        value: true
      - type: compare
        metric: elapsed_ticks
        operator: <=
        parameter: limit_ticks
  - reason: timeout
    result: failure
    when:
      type: compare
      metric: elapsed_ticks
      operator: '>='
      parameter: limit_ticks
  time_limit_s: 180
  timer_start: first_deployment
  target: patrol_enemy
evaluation:
  type: terminal_diagnostics
  publish_on: terminal
  metrics:
  - id: rmse_m
    type: position_rmse
  - id: yaw_rmse_rad
    type: yaw_rmse
randomization:
  seed: 0
  reset_on: new_run
  generator: python_random_v1
tutorial:
  problem: 截获敌车车头 GPS 的地图系 x/y，同时获得底盘中心的车体系 Radar (r,theta)。联合估计敌车中心与 yaw，人工瞄准有效装甲。
  hints:
  - 融合不同坐标系与不同安装点的观测，估计敌车 x/y/yaw，并理解装甲安装几何。
  - F2 文件树高亮本关主要编辑文件；已有 perception/、weapons/ 源码和历史版本保留。
  - 运行中主界面可看日志，修改前请结束或重置本次尝试。
  lesson:
    title: C4 · 拦截车头 GPS，融合敌车位姿
    summary: 融合不同坐标系与不同安装点的观测，估计敌车 x/y/yaw，并理解装甲安装几何。
    steps:
    - 底盘锁定，自身位姿由系统提供。阅读本关高亮文件的带类型签名、输入参考系、单位及返回约定。
    - gps_xy 是地图系车头位置，不是底盘中心；measurements_rt 是我方车体系底盘中心距离/方位，两个传感器的空帧分别处理。
    - 联合估计中心和 yaw，利用公开的车头安装偏移和装甲几何；原地转向时 GPS 点随车体转动，提供新的方向信息。
    - 发布的估计车体和装甲显示来自自己的算法。按 J/L 与空格人工瞄准有效装甲，击中非装甲只吸弹、不扣血。
    files:
    - path: perception/fusion_tracker.py
      role: 本关填写：中心 Radar 与车头 GPS 融合，估计中心和 yaw。
    - path: perception/polar_tracker.py
      role: 复用 C3 的滤波代码；不会被升级覆盖。
    default_type: TargetPoseEstimate
    functions:
    - path: perception/fusion_tracker.py
      name: update
    aliases:
      measurements_rt: ndarray
      gps_xy: ndarray
      own_pose: ndarray
    completion: 首次成功部署后计时，限时 {time_limit_s} 仿真秒，双方 {max_hp} HP。存活并击杀敌车通关；玩家死亡或超时失败，主动结束后可编辑。运行中不公开目标真值误差。
    common_errors:
    - 不要把 range/bearing 当作地图 x/y；角度创新须归一到 [-pi,pi)。
    - 数组只有当前帧，不是历史；需要保留状态或窗口时必须限制大小。
    - 运行阶段不能打开编辑器；请先结束本次尝试，修改保存后重试。
    execution: 框架以 {algorithm_hz} Hz 提供同期 NumPy 观测。Radar 距离 σ={range_stddev_m:g} m、方位 σ={bearing_stddev_rad:g} rad、独立丢失 {drop_probability:.0%}；dt
      是仿真秒。空数组为当前帧缺测，内部状态跨调用保存，部署或重试重新初始化。
    calibration:
      enemy_drive_model:
        source: target_drive_model
      enemy_forward_only:
        source: target_forward_only
      kinematics:
        text: 车体系 vy=0；vx=r(ω_right+ω_left)/2；wz=r(ω_right−ω_left)/track。中心轨迹在运动时提供航向线索；原地转向的 yaw 不可唯一观测。
      wheel_radius_m:
        source: wheel_radius_m
      track_m:
        source: differential_track_m
      body_length_m:
        source: body_length_m
      body_width_m:
        source: body_width_m
      projectile_speed_mps:
        source: projectile_speed_mps
      max_acceleration_radps2:
        source: max_acceleration_radps2
      armor_width_m:
        source: armor_width_m
      armor_mounts:
        source: armor_mounts
      armor_columns:
        text: '[底盘系 x_m, 底盘系 y_m, 向外法线 yaw_rad]；依次前、后、左、右；接触点落在中央装甲段才扣血。'
      gps_mount:
        source: gps_mount
      gps_measurement_covariance:
        source: gps_covariance
      radar_measurement_covariance:
        source: radar_covariance
    type_notes: {}
    ui:
      state_heading: 02 / AUTHORIZED SELF POSE
      legend_pose: 系统自定位
      view_note: 系统提供自身位姿和可见炮弹；敌车位置来自 Python 的估计。雷达图仅显示车体系观测。炮弹图层可在设置中切换。
      mode_label: 教学视图 · 系统自定位 / 玩家目标估计
      freshness_message: 系统提供自身位姿和可见炮弹；敌车只有玩家目标估计
      progress_layout: health
      default_file: perception/fusion_tracker.py
    edit_files:
    - perception/fusion_tracker.py
  testing:
    checks:
    - Python 语法与导入；项目接口、连线和发布权限。
    - tests/test_*.py 中的项目单元测试；默认检查空观测、类型与基本数值契约，可自行补充算法样例。
    - 使用获授权传感器输入试运行 {test_batches} 个批次，检查异常、超时和输出消息。
    meaning: 通过表示此快照可以加载并通过这些样例和短时间试运行，不代表算法效果完美或关卡通关。测试输出不会控制坦克，也不会进入正式画面。
scaffolding:
  components:
  - polar_tracker
  - raw_sensor_adapters
  - fusion_tracker
  - polar_contract_tests
  - fusion_contract_tests
  documentation:
    perception/fusion_tracker.py:
    - function: update
      text: 'measurements_rt: shape=(N,2) 的当前车体系底盘中心原始 [r,theta]；gps_xy: shape=(M,2) 的地图系敌车车头 GPS [x,y]，N/M 当前为 0 或 1，空数组表示本帧无观测。

        own_pose: shape=(3,) 的系统自身 [x,y,yaw]；dt: float 仿真秒。GPS 与 Radar 为独立噪声/丢失，框架按同一采样 tick 传入，不把旧 fix 冒充新数据。

        返回 TargetPoseEstimate(x_m: float,y_m: float,yaw_rad: float,covariance=None) 或 None，描述敌车底盘中心及朝向，参考系 map；covariance
        可空或 (3,3) NumPy 矩阵。

        GPS 安装偏移 gps_mount=[a,0] 是公开几何。观测模型为 gps_x=center_x+a*cos(yaw)、gps_y=center_y+a*sin(yaw)。因此 GPS 点不是敌车中心；与中心 Radar
        联合后，原地转向也产生朝向信息。

        可复用 perception/polar_tracker.py 的滤波思想，或自行实现联合估计；单帧两个带噪点直接 atan2 会抖动，应维护跨帧状态。radar_covariance/gps_covariance 由 YAML
        提供，丢失时保持合理不确定性。'
    perception/polar_tracker.py:
    - function: update
      text: '输入 measurements_rt: numpy.ndarray，shape=(N,2)，每行 [range_m, bearing_rad]，单位 m/rad，均在当前我方 base_link；无检测为 shape=(0,2)，不是历史缓存。

        own_pose: shape=(3,) 的系统公开自身 [x_m,y_m,yaw_rad]；dt: float 为仿真秒。

        返回 PolarTargetEstimate(range_m: float, bearing_rad: float, covariance=None) 或 None。输出仍在当前车体系，bearing 归一到 [-pi,pi)，covariance
        为 (2,2) NumPy 矩阵，顺序 r/theta。

        内部可以保存笛卡尔状态 [x,y,vx,vy]，观测模型使用距离 hypot 和方位 atan2；只改变输入输出坐标并不会自动构成 EKF。预测、Jacobian、创新和协方差更新由你实现；方位创新必须绕回 [-pi,pi)。不强制唯一算法。

        空测量时可只预测；保存有界状态，避免无限追加历史。measurement_covariance 来自关卡 YAML；框架不先替你把雷达测量变成全局 x/y。'
