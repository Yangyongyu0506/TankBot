schema_version: '1.0'
metadata:
  id: c4
  name: C4 · 从底盘中心推算装甲瞄准点
  description: 雷达仍只测底盘中心。估计敌车 x/y/yaw，结合公开的差速模型与四面装甲安装位置，选择装甲点并自动击杀。原地转向的 yaw 不可直接观测。
  chapter:
    chapter_id: weapons
    title: Weapons
    description: 锁定底盘，依次学习坐标变换、目标跟踪、自瞄和装甲瞄准。
  order: 4
  version: 1.0.1
  learning_objectives:
  - 估计敌车底盘中心与 yaw，将公开装甲安装偏移变换为瞄准点，再复用 C3 控制器。
  recommended_algorithms: []
  prerequisites:
  - c3
world:
  dimension: 2
  frame_id: map
  simulation:
    physics_hz: 60
    substeps: 4
    sensor_hz: 30
    algorithm_hz: 10
  map:
    source: inline
    walls:
    - center:
      - 6.1
      - 0.0
      size:
      - 0.2
      - 8.4
    - center:
      - -6.1
      - 0.0
      size:
      - 0.2
      - 8.4
    - center:
      - 0.0
      - 4.1
      size:
      - 12.0
      - 0.2
    - center:
      - 0.0
      - -4.1
      size:
      - 12.0
      - 0.2
    - center:
      - 2.0
      - 0.0
      size:
      - 0.2
      - 3.0
robots:
- id: player
  type: tank
  role: player
  model: scene_selected
  initial_pose:
  - 0.0
  - 0.0
  - 0.0
  initial_velocity:
  - 0.0
  - 0.0
  - 0.0
  health:
    max_hp: 3
    damage_per_hit: 1
    collision_damage: 0
    death_behavior: remove_at_substep_end
  control_sources:
    chassis: disabled
    turret: robot
    weapon: robot
  sensors:
  - type: wheel_encoder
    topic: /robot/sensors/joint_states
    schema: joint_state@1
    frame_id: base_link
    update_hz: 30
  - type: imu
    topic: /robot/sensors/imu
    schema: imu@1
    frame_id: base_link
    update_hz: 30
  - type: turret_joint
    topic: /robot/turret/joint_states
    schema: joint_state@1
    frame_id: base_link
    update_hz: 30
  - type: weapon_state
    topic: /robot/weapons/cannon/state
    schema: weapon_state@1
    frame_id: base_link
    update_hz: 30
  - type: radar
    topic: /robot/sensors/radar
    schema: radar@1
    frame_id: radar_link
    update_hz: 10
    parameters:
      mount_m:
      - 0.0
      - 0.0
      yaw_rad: 0.0
      frame_id: radar_link
      range_m: 12.0
      field_of_view_rad: 6.283185307179586
      update_hz: 10
      occlusion: walls
      measurement: target_center
      latency_ticks: 0
      range_bias_m: 0.0
      bearing_bias_rad: 0.0
      noise:
        range_stddev_m: 0.45
        bearing_stddev_rad: 0.08
        drop_probability: 0.1
- id: patrol_enemy
  type: patrol_tank
  role: target
  initial_pose:
  - -4.5
  - -2.0
  - 0.0
  parameters:
    motion:
      chassis: differential
      initial_velocity:
      - 0.0
      - 0.0
      - 0.0
      initial_turret_angle_rad: 0.0
      initial_turret_rate_radps: 0.0
      control_hz: 10
      waypoints_m:
      - - -1.5
        - -2.0
      - - -1.5
        - 2.0
      - - -4.5
        - 2.0
      - - -4.5
        - -2.0
      forward_speed_mps: 0.6
      heading_gain_per_s: 2.0
      max_yaw_rate_radps: 1.5
      turn_in_place_threshold_rad: 0.35
      arrival_radius_m: 0.25
    health:
      max_hp: 3
      damage_per_hit: 1
      collision_damage: 0
      death_behavior: remove_at_substep_end
    armor:
      layout: four_side_centers
      width_m: 0.24
communication:
  runtime:
    template_version: 2.0.0
    manifest:
      manifest_version: '1.0'
      sdk_version: 0.1.0
      protocol_version: '1.0'
      project_id: weapons-robot
      entry_point: robot_modules.weapons:CoordinatesModule
      modules:
      - module_id: coordinates
        contract: contracts/coordinates.json
        config: {}
      - module_id: tracking
        contract: contracts/tracking.json
        config: {}
      - module_id: aiming
        contract: contracts/aiming.json
        config: {}
      connections:
      - from: /robot/localization/pose
        to: coordinates.self_pose
      - from: /robot/sensors/radar
        to: coordinates.radar
      - from: coordinates.points
        to: /robot/modules/coordinates/points
      - from: /robot/modules/coordinates/points
        to: tracking.points
      - from: tracking.target
        to: /robot/estimates/tracking/target_pose
      - from: /robot/localization/pose
        to: aiming.self_pose
      - from: /robot/turret/joint_states
        to: aiming.turret
      - from: /robot/weapons/cannon/state
        to: aiming.weapon
      - from: /robot/estimates/tracking/target_pose
        to: aiming.target
      - from: aiming.acceleration
        to: /robot/turret/cmd_accel
      - from: aiming.fire
        to: /robot/weapons/cannon/fire
      dependencies: []
      pose_source:
        mode: system
        module_id: null
        fallback: none
    contracts:
      coordinates:
        contract_version: '1.0'
        module_id: coordinates
        entry_point: robot_modules.weapons:CoordinatesModule
        inputs:
          self_pose:
            schema: pose2d@1
            required: true
            max_age_ticks: 24
          radar:
            schema: radar@1
            required: true
            max_age_ticks: 24
        outputs:
          points:
            schema: target_points@1
        execution:
          mode: periodic
          period_ticks: 6
          deadline_ticks: 6
          budget_ms: 6
        dependencies: []
        state_version: '1'
      tracking:
        contract_version: '1.0'
        module_id: tracking
        entry_point: robot_modules.weapons:PoseTrackingModule
        inputs:
          points:
            schema: target_points@1
            required: true
            max_age_ticks: 24
        outputs:
          target:
            schema: target_pose_estimate@1
        execution:
          mode: periodic
          period_ticks: 6
          deadline_ticks: 6
          budget_ms: 6
        dependencies:
        - coordinates
        state_version: '1'
      aiming:
        contract_version: '1.0'
        module_id: aiming
        entry_point: robot_modules.weapons:AimingModule
        inputs:
          self_pose:
            schema: pose2d@1
            required: true
            max_age_ticks: 24
          turret:
            schema: joint_state@1
            required: true
            max_age_ticks: 24
          weapon:
            schema: weapon_state@1
            required: true
            max_age_ticks: 24
          target:
            schema: target_pose_estimate@1
            required: false
            max_age_ticks: 24
        outputs:
          acceleration:
            schema: turret_acceleration@1
          fire:
            schema: fire_command@1
        execution:
          mode: periodic
          period_ticks: 6
          deadline_ticks: 6
          budget_ms: 6
        dependencies:
        - tracking
        state_version: '1'
    target_source: tracking
    managed_files:
    - tankbot.json
    - robot_modules/weapons.py
    - contracts/coordinates.json
    - contracts/tracking.json
    - contracts/aiming.json
    - tests/test_coordinates.py
    - tests/test_auto_aim.py
    mode: graph
    profile_id: weapons_armor
    logical_module:
      module_id: perception
      entry_point: campaign_robot:CampaignRobot
    processing: modules
permissions:
  data_access:
    inputs:
      /robot/localization/pose: pose2d@1
      /robot/sensors/radar: radar@1
      /robot/turret/joint_states: joint_state@1
      /robot/weapons/cannon/state: weapon_state@1
    outputs:
    - target_pose_estimate@1
    actuators:
      /robot/turret/cmd_accel: turret_acceleration@1
      /robot/weapons/cannon/fire: fire_command@1
  visualization:
    view_policy:
      policy_id: campaign-c4
      system_pose_allowed: true
      player_pose_allowed: false
      allowed_pose_frames:
      - map
      public_map: m1-test-map
      local_observation_channels:
      - /robot/sensors/joint_states
      - /robot/sensors/imu
      - /robot/turret/joint_states
      - /robot/weapons/cannon/state
      - /robot/sensors/radar
      true_enemy_objects: false
      world_effects: true
      camera_source: selected_pose_or_manual
      pose_fresh_ticks: 12
      pose_hide_after_ticks: 60
      robot_topics_allowed: true
      target_estimates_allowed: true
    allowed_layers:
    - map
    - robot
    - trail
    - target_estimates
    - radar
    - imu
    - encoders
    - turret
    - projectiles
    - frames
  public_initial_pose: true
  public_map: true
visualization:
  initial_enabled:
  - map
  - robot
  - trail
  - target_estimates
  - radar
  - imu
  - encoders
  - turret
  - projectiles
  user_toggleable:
  - map
  - robot
  - trail
  - target_estimates
  - radar
  - imu
  - encoders
  - turret
  - projectiles
  - frames
  sources:
    map: map
    robot: selected_pose
    trail: selected_pose
    target_estimates: player_estimate
    radar: local_observation
    imu: local_observation
    encoders: local_observation
    turret: local_observation
    projectiles: authorized_truth
    frames: selected_pose
  preserve_user_settings: true
objectives:
  parameters:
    movement_m: 0.0
    turn_rad: 0.0
    required_hits: 0
    required_estimates: 0
  progress:
    moved:
      type: displacement
      parameter: movement_m
      sticky: true
    turned:
      type: heading_change
      parameter: turn_rad
      sticky: true
  success:
    type: compare
    metric: target_alive
    operator: ==
    value: false
  outcomes:
  - reason: player_dead
    result: failure
    when:
      type: compare
      metric: player_alive
      operator: ==
      value: false
  - reason: objective_completed
    result: success
    when:
      type: all
      conditions:
      - type: compare
        metric: objective_complete
        operator: ==
        value: true
      - type: compare
        metric: elapsed_ticks
        operator: <=
        parameter: limit_ticks
  - reason: timeout
    result: failure
    when:
      type: compare
      metric: elapsed_ticks
      operator: '>='
      parameter: limit_ticks
  time_limit_s: 180
  timer_start: first_deployment
  target: patrol_enemy
evaluation:
  type: terminal_diagnostics
  publish_on: terminal
  metrics:
  - id: rmse_m
    type: position_rmse
  - id: yaw_rmse_rad
    type: yaw_rmse
randomization:
  seed: 0
  reset_on: new_run
  generator: python_random_v1
tutorial:
  problem: 雷达仍只测底盘中心。估计敌车 x/y/yaw，结合公开的差速模型与四面装甲安装位置，选择装甲点并自动击杀。原地转向的 yaw 不可直接观测。
  hints:
  - F2 查看自动生成的模块链；C1 的 transforms.py、C2 的 tracker.py 会保留。
  - 炮台只能发布相对角加速度（rad/s²），不能直接设置角度或角速度。
  - 原地转向时仅中心观测无法唯一确定敌车 yaw；可预测或暂不射击。
  - 保存 → 测试 → 部署后计时；J/L 和空格不再直接操控武器，可随时结束尝试。
  lesson:
    title: C4 · 从底盘中心推算装甲瞄准点
    summary: 估计敌车底盘中心与 yaw，将公开装甲安装偏移变换为瞄准点，再复用 C3 控制器。
    steps:
    - Weapons 章节锁定玩家底盘；自身位姿继续由系统提供，本阶段不要求实现自身定位。
    - C1 的矩阵变换、C2 的跟踪分别运行在独立模块；所有模块读冻结输入，输出固定在后续 tick 提交。
    - 完成 perception/pose_tracker.py 的 PoseTracker.update，再完成 weapons/armor_aim.py。
    - 敌车只前进、不倒车，可原地转向；原地转向时的 yaw 不能仅靠中心位置唯一恢复。
    - 可通过「模块」页查看连线、预算、输入等待或错误；「日志」显示 print 和调用栈。
    - 正式尝试持续计时，打开编辑器不暂停；可在任务页或编辑器点击「结束本次尝试」，修改保存后重试。
    files:
    - path: perception/pose_tracker.py
      role: 敌车中心与航向估计。
    - path: weapons/armor_aim.py
      role: 装甲点选择与预测。
    - path: weapons/auto_aim.py
      role: 复用 C3 控制器。
    default_type: TargetPoseEstimate
    functions:
    - path: perception/pose_tracker.py
      name: update
    - path: weapons/armor_aim.py
      name: update
    aliases:
      observation: AimInput
      result: AimOutput
      measurements: ndarray
    completion: 存活并让敌车 HP 归零。有效击中点以真实弹丸接触判定；运行中不公布真值误差。 限时 {time_limit_s} 仿真秒。首次成功部署后开始计时，之前的编辑和测试不计时；重复部署不重置。 我方与敌方均为
      {max_hp} HP，每发命中扣 {damage_per_hit} HP；反弹自伤也扣血，碰墙不扣血。我方死亡判失败，同时死亡也失败。
    common_errors:
    - 角加速度不是角速度；零角加速度不会立即停止转动。
    - 必须先估计敌车 yaw，不能把雷达方位角当成敌车航向。
    execution: 三个独立模块通过冻结 Topic 快照交互，按各自 Contract 调度。输出在固定提交门生效；target_age_s 已包含本次提交等待。缺输入时模块等待，正常异常只影响对应模块，整个 Worker
      超时则终止本台机器人的所有模块。 雷达距离 σ={range_stddev_m:g} m，方位 σ={bearing_stddev_rad:g} rad，独立丢失 {drop_probability:.0%}。
    calibration:
      enemy_drive_model:
        source: target_drive_model
      enemy_forward_only:
        source: target_forward_only
      kinematics:
        text: 车体系 vy=0；vx=r(ω_right+ω_left)/2；wz=r(ω_right−ω_left)/track。中心轨迹在运动时提供航向线索；原地转向的 yaw 不可唯一观测。
      wheel_radius_m:
        source: wheel_radius_m
      track_m:
        source: differential_track_m
      body_length_m:
        source: body_length_m
      body_width_m:
        source: body_width_m
      projectile_speed_mps:
        source: projectile_speed_mps
      max_acceleration_radps2:
        source: max_acceleration_radps2
      armor_width_m:
        source: armor_width_m
      armor_mounts:
        source: armor_mounts
      armor_columns:
        text: '[底盘系 x_m, 底盘系 y_m, 向外法线 yaw_rad]；依次前、后、左、右；接触点落在中央装甲段才扣血。'
    type_notes:
      TargetPoints:
        description: 当前帧地图坐标测量矩阵，不包含历史。
        fields:
          positions_m: 只读 float64 NumPy 数组，shape=(N,2)，列为 x/y，单位 m；无检测时 shape=(0,2)。
      TargetPoseEstimate:
        description: 玩家估计的敌车底盘中心与车头朝向，与自身位姿完全分离。
        fields:
          x_m: 敌车中心在 map 中的 x，m。
          y_m: 敌车中心在 map 中的 y，m。
          yaw_rad: 敌车车头相对 map +x 的逆时针角，rad，范围 [-π,π)。
          covariance: None 或只读 (3,3) NumPy 协方差，对应 x/y/yaw；原地转向时 yaw 不可直接观测。
      AimInput:
        description: 自瞄函数的授权输入；数组都是只读 NumPy，玩家无需处理 Topic。
        fields:
          target_xy: None 或 shape=(2,) 的地图目标位置 [x,y]，m；C4 仍为敌车底盘中心。
          target_age_s: 在本批控制提交时，目标估计已经过去的仿真秒；包含等待提交的延迟。
          own_pose: shape=(3,) 的系统自身位姿 [x,y,yaw]，单位 m、rad。Weapons 阶段不要求估计自己。
          turret_angle_rad: 炮台相对车体的累计角，rad；可连续旋转。
          turret_rate_radps: 炮台相对角速度，rad/s。
          weapon_ready: 本机是否已冷却，bool。
          target_yaw_rad: C3 为 None；C4 为玩家估计的敌车朝向，rad。不是雷达方位角。
      AimOutput:
        description: 算法的自瞄结果，由框架转换为合法控制消息。
        fields:
          acceleration_radps2: 炮台相对角加速度目标，rad/s²；不能直接写角度/角速度。
          fire: bool，True 请求单发；框架处理冷却和请求 ID。
      TurretAcceleration:
        description: 炮台相对角加速度 Topic 的类型化负载。
        fields:
          acceleration_radps2: 目标角加速度，rad/s²；真实响应仍由受限力矩和双刚体动力学决定。
      Pose2D:
        description: 自身的二维位姿。C0–C2 由系统公开提供；位置在 map 中，车头方向用 yaw 表示。
        fields:
          x_m: 地图横坐标，单位 m，向右为正。
          y_m: 地图纵坐标，单位 m，向上为正。
          yaw_rad: 车头相对地图 +x 的逆时针角，单位 rad；π/2 表示朝向 +y。
          covariance: None 或只读 float64 NumPy 矩阵，shape=(3,3)，依次对应 x、y、yaw；本关可以忽略。
          child_frame_id: 被描述的车体系名称，通常为 base_link；本关可以忽略。
      RadarDetection:
        description: 一次雷达检测。先在车体系里测量，不能直接当作地图坐标。
        fields:
          observation_id: 仅本次观测的标签；不能用它识别跨帧的同一敌车。
          range_m: 传感器中心到目标中心的距离，单位 m。
          bearing_rad: 相对车头的方位角，单位 rad；前方为 0，左侧为正。
      RadarData:
        description: 一帧雷达数据。没有检测时 detections 是空元组 ()。
        fields:
          detections: 不可变的 RadarDetection 元组；逐项读取，不需要解析 JSON。
      TargetEstimate:
        description: 算法在 map 中估计的目标位置。C2 跟踪器返回这个值；C1 的矩阵结果由框架转换为它。
        fields:
          x_m: 目标估计的地图横坐标，单位 m。
          y_m: 目标估计的地图纵坐标，单位 m。
          covariance: None 或只读 float64 NumPy 矩阵，shape=(2,2)，对应 x、y；入门时保留 None。
      Sample:
        description: 框架使用的带采样时刻的数据包装；入门函数收到的是内部 data，无需手动拆包。
        fields:
          data: 类型参数 T 对应的数据，例如 Pose2D 或 RadarData。
          simulation_tick: 数据采样的仿真 tick，不是网络到达时间。
          frame_id: 数据参考坐标系名称。
          sequence_number: 该数据流递增的序号。
      JointState:
        description: 按轮名排列的关节角、角速度和力矩，主要用于后续里程计。
        fields:
          name: 轮/关节名称元组。
          position: 与 name 对齐的累计角，单位 rad。
          velocity: 与 name 对齐的角速度，单位 rad/s。
          effort: 力矩，单位 N·m；未报告时为空元组。
      ImuData:
        description: 车体系内的惯性观测。
        fields:
          angular_velocity_z_radps: 绕 z 的角速度，rad/s。
          linear_acceleration_x_mps2: 沿车头 x 的加速度，m/s²。
          linear_acceleration_y_mps2: 沿车体左方 y 的加速度，m/s²。
      EncoderData:
        description: 累计轮距的旧示例类型；当前轮组观测使用 JointState。
        fields:
          left_distance_m: 本 run 起的左轮累计距离，m。
          right_distance_m: 本 run 起的右轮累计距离，m。
      Vector3:
        description: 三维向量；具体单位由使用它的接口决定。
        fields:
          x: x 分量。
          y: y 分量。
          z: z 分量。
      Twist:
        description: 车体系目标速度。二维模型只使用 linear.x/y 和 angular.z。
        fields:
          linear: 线速度，m/s。
          angular: 角速度，rad/s。
      TurretVelocity:
        description: 炮台相对车体的目标角速度。
        fields:
          velocity_radps: 逆时针为正，单位 rad/s。
      FireCommand:
        description: 一次单发开火意图，进阶接口由 ModuleContext.fire 生成幂等请求。
        fields: {}
      FireResult:
        description: 自己提交的开火请求结果；不含命中坐标。
        fields:
          request_id: 请求标识。
          status: fired/cooldown/blocked/resource_limit。
          processed_tick: 处理请求的仿真 tick。
      WeaponState:
        description: 自己的武器状态。
        fields:
          ready: 是否可以开火。
          cooldown_remaining_ticks: 剩余冷却 tick。
          shots_fired: 本 run 已发射数量。
          hits_received: 自己的受击计数。
          last_result: 最近一次开火结果，无结果时为 None。
      Inputs:
        description: 框架端口输入集合；入门关卡已替你取出具体数据。
        fields: {}
      ModuleContext:
        description: 框架提供的时间、只读配置和输出接口。
        fields:
          simulation_tick: 当前算法激活 tick。
          dt_seconds: 距上次调用的仿真秒。
          output_commit_tick: 本批次输出的固定提交 tick。
          config: 任务授予的只读配置，不包含敌车真值。
      Module:
        description: 框架模块生命周期。入门时使用生成的包装，不需要自己编写消息或管理进程。
        fields: {}
      ndarray:
        description: NumPy 数组。C1 返回 float64 的 (4,4) 矩阵；@ 表示矩阵与向量相乘。
        fields:
          shape: 数组形状；SE(3) 必须是 (4,4)。
          dtype: 元素类型；本关使用 np.float64。
          T: 转置。注意转置通常不等于 SE(3) 的逆。
    ui:
      state_heading: 02 / AUTHORIZED SELF POSE
      legend_pose: 系统自定位
      view_note: 系统提供自身位姿和可见炮弹；敌车位置来自 Python 的估计。雷达图仅显示车体系观测。炮弹图层可在设置中切换。
      mode_label: 教学视图 · 系统自定位 / 玩家目标估计
      freshness_message: 系统提供自身位姿和可见炮弹；敌车只有玩家目标估计
      progress_layout: health
      default_file: perception/pose_tracker.py
  testing:
    checks:
    - Python 语法与导入；项目接口、连线和发布权限。
    - tests/test_*.py 中的单元测试；C1/C2 默认包含 SE(3) 合法性、旋转/平移与方向样例。
    - 使用获授权传感器输入试运行 {test_batches} 个批次，检查异常、超时和输出消息。
    meaning: 通过表示此快照可以加载并通过这些样例和短时间试运行，不代表算法效果完美或关卡通关。测试输出不会控制坦克，也不会进入正式画面。
scaffolding:
  components:
  - weapons_adapters
  - se3_transform
  - point_tracker
  - auto_aim
  - armor_aim
  - se3_tests
  - auto_aim_tests
  - pose_tracker
  documentation:
    perception/transforms.py:
    - function: radar_to_map
      text: "返回 T_map_radar：把雷达坐标变为地图坐标的 SE(3) 元素。\n\n输入（使用 own_pose.字段名 读取）：\n  own_pose.x_m / y_m: float，自身在地图中的位置，单位\
        \ m。\n  own_pose.yaw_rad: float，车头相对地图 +x 的逆时针角，单位 rad。\n\n返回：numpy.ndarray，shape=(4,4)，dtype=float64。\n\
        左上 3x3 放旋转 R，右上 3x1 放雷达原点在 map 中的位置 t。\n最后一行固定为 [0,0,0,1]；本关 z=0，只需考虑绕 z 轴旋转。\n三个旋转列是雷达基向量在地图中的方向，平移列是雷达原点。\n\
        游戏会实际执行 point_map = T_map_radar @ point_radar。\npoint_radar 是 [x,y,0,1]，你不需要处理检测列表或消息发布。\n\n自测：自身 (1,3,pi/2)，雷达点\
        \ [2,0,0,1] 应变为 [1,5,0,1]。\nF1 /「关卡说明 / 类型」中的矩阵实验可调整位姿并查看每一行乘法。"
    perception/tracker.py:
    - function: update
      text: "输入已经用 C1 的 SE(3) 矩阵转换到地图系，无需处理网络。\n\nmeasurements: tuple[TargetEstimate, ...]，不可变的测量列表。\n  有回波时 measurements[0]\
        \ 的 x_m / y_m 是 float，单位 m。\n  丢失时为 ()；先检查 if measurements，再访问第一个元素。\ndt: float，距上次算法调用的仿真秒，不是实际等待时间。\n\
        返回：TargetEstimate 表示当前地图目标估计；None 表示尚无估计。\n更新 self.estimate 可保留状态；不要每次调用都把状态清空。\n平滑、窗口或预测等方法均可。F1 可查看类型定义与调用示例。"
    weapons/auto_aim.py:
    - function: update
      text: '输入仅含本关授权数据，不需要自己处理 Topic 或 JSON。


        observation.target_xy: None 或 shape=(2,) 的地图目标估计 [x,y]，单位 m。

        observation.target_age_s: 在本批控制提交时，该目标估计已过去的仿真秒。

        observation.own_pose: shape=(3,) 的系统自身位姿 [x,y,yaw]，单位 m、rad。

        observation.turret_angle_rad: 炮台相对车体的累计角，rad（允许连续旋转）。

        observation.turret_rate_radps: 相对角速度，rad/s。

        observation.weapon_ready: 本机武器当前是否已冷却完成。

        dt: 本模块两次实际调用间的仿真秒；与传感器采样间隔并非同一概念。

        返回 AimOutput(acceleration_radps2=相对角加速度, fire=是否请求单发)。


        先用目标与自身位置计算期望朝向；角误差用 atan2(sin(e),cos(e))。

        只能输出角加速度，不可直接设角度/角速度；考虑角速度反馈与制动。

        可以用跨调用的 NumPy 状态估计目标速度，补偿观测延迟和飞行时间。

        没有目标时不要盲射。框架负责冷却检查、幂等请求与控制权限。'
    weapons/armor_aim.py:
    - function: update
      text: '输入与 C3 一致，但 target_xy 是敌车底盘中心，target_yaw_rad 是玩家估计的敌车朝向。

        雷达始终观测底盘中心，不会给真实 yaw 或装甲坐标。

        armor_mounts: shape=(4,3)，安装偏移单位 m、法线角单位 rad。

        公开差速模型：车体系 vy=0，只前进，可原地转向；具体巡逻路径不是传感器数据。

        将装甲安装偏移用估计 yaw 旋转后加上中心位置，得到地图瞄准点。

        可复用 C1 的矩阵方法、C3 AutoAim 的控制逻辑，并考虑敌车未来姿态。

        没有可靠 yaw 时可保持/预测或暂不射击。输出仍只能是角加速度和单发意图。'
    perception/pose_tracker.py:
    - function: update
      text: 'measurements 是本帧敌车底盘中心的地图测量，shape=(N,2)，N 为 0 或 1。

        列为 x/y，单位 m；空数组 shape=(0,2)，不是历史轨迹。

        dt 为距上次调用的仿真秒。返回敌车中心 x/y、车头 yaw 的估计；None 表示尚无估计。

        TargetPoseEstimate(x_m: float, y_m: float, yaw_rad: float, covariance=None)。

        yaw 是 map +x 起逆时针弧度，归一化到 [-pi,pi)；协方差可空或 (3,3) NumPy 矩阵。

        敌车本关仅向车头前进、可原地转向，不倒车；运动时可由平滑轨迹估计航向。

        仅凭中心位置不能唯一知道原地转向时的 yaw；应预测/保持并表达不确定性。

        保留带上限的历史或固定维数的 NumPy 状态，不要无限追加。'
