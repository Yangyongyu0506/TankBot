schema_version: '1.0'
metadata:
  id: c3
  name: C3 · 直接处理距离与方位观测
  description: 雷达直接提供车体系 (r,theta)。处理非线性观测并输出车体系极坐标估计，人工瞄准击杀敌车。
  chapter:
    chapter_id: weapons
    title: Weapons
    description: 锁定底盘，依次学习坐标变换、目标跟踪、自瞄和装甲瞄准。
  order: 3
  version: 3.0.0
  learning_objectives:
  - 从线性位置观测进阶到距离/方位观测；内部模型可使用 EKF，对外仍返回 (r,theta)。
  recommended_algorithms: []
  prerequisites:
  - c2
world:
  dimension: 2
  frame_id: map
  simulation:
    physics_hz: 60
    substeps: 4
    sensor_hz: 30
    algorithm_hz: 10
  map:
    source: inline
    walls:
    - center:
      - 6.1
      - 0.0
      size:
      - 0.2
      - 8.4
    - center:
      - -6.1
      - 0.0
      size:
      - 0.2
      - 8.4
    - center:
      - 0.0
      - 4.1
      size:
      - 12.0
      - 0.2
    - center:
      - 0.0
      - -4.1
      size:
      - 12.0
      - 0.2
    - center:
      - 2.0
      - 0.0
      size:
      - 0.2
      - 3.0
robots:
- id: player
  type: tank
  role: player
  model: scene_selected
  initial_pose:
  - 0.0
  - 0.0
  - 0.0
  initial_velocity:
  - 0.0
  - 0.0
  - 0.0
  health:
    max_hp: 3
    damage_per_hit: 1
    collision_damage: 0
    death_behavior: remove_at_substep_end
  control_sources:
    chassis: disabled
    turret: keyboard
    weapon: keyboard
  sensors:
  - type: wheel_encoder
    topic: /robot/sensors/joint_states
    schema: joint_state@1
    frame_id: base_link
    update_hz: 30
  - type: imu
    topic: /robot/sensors/imu
    schema: imu@1
    frame_id: base_link
    update_hz: 30
  - type: turret_joint
    topic: /robot/turret/joint_states
    schema: joint_state@1
    frame_id: base_link
    update_hz: 30
  - type: weapon_state
    topic: /robot/weapons/cannon/state
    schema: weapon_state@1
    frame_id: base_link
    update_hz: 30
  - type: radar
    topic: /robot/sensors/radar
    schema: radar@1
    frame_id: radar_link
    update_hz: 10
    parameters:
      mount_m:
      - 0.0
      - 0.0
      yaw_rad: 0.0
      frame_id: radar_link
      range_m: 12.0
      field_of_view_rad: 6.283185307179586
      update_hz: 10
      occlusion: walls
      measurement: target_center
      latency_ticks: 0
      range_bias_m: 0.0
      bearing_bias_rad: 0.0
      noise:
        range_stddev_m: 0.45
        bearing_stddev_rad: 0.08
        drop_probability: 0.1
- id: patrol_enemy
  type: patrol_tank
  role: target
  initial_pose:
  - -4.5
  - -2.0
  - 0.0
  parameters:
    motion:
      chassis: differential
      initial_velocity:
      - 0.0
      - 0.0
      - 0.0
      initial_turret_angle_rad: 0.0
      initial_turret_rate_radps: 0.0
      control_hz: 10
      waypoints_m:
      - - -1.5
        - -2.0
      - - -1.5
        - 2.0
      - - -4.5
        - 2.0
      - - -4.5
        - -2.0
      forward_speed_mps: 0.6
      heading_gain_per_s: 2.0
      max_yaw_rate_radps: 1.5
      turn_in_place_threshold_rad: 0.35
      arrival_radius_m: 0.25
    health:
      max_hp: 3
      damage_per_hit: 1
      collision_damage: 0
      death_behavior: remove_at_substep_end
communication:
  runtime:
    template_version: 5.0.0
    manifest:
      manifest_version: '1.0'
      sdk_version: 0.1.0
      protocol_version: '1.0'
      project_id: weapons-robot
      entry_point: robot_modules.observations:PolarTrackingModule
      modules:
      - module_id: tracking
        contract: contracts/tracking.json
        config: {}
      connections:
      - from: /robot/localization/pose
        to: tracking.self_pose
      - from: /robot/sensors/radar
        to: tracking.radar
      - from: tracking.target
        to: /robot/estimates/tracking/target_polar
      dependencies: []
      pose_source:
        mode: system
        module_id: null
        fallback: none
    contracts:
      tracking:
        contract_version: '1.0'
        module_id: tracking
        entry_point: robot_modules.observations:PolarTrackingModule
        inputs:
          self_pose:
            schema: pose2d@1
            required: true
            max_age_ticks: 24
          radar:
            schema: radar@1
            required: true
            max_age_ticks: 24
        outputs:
          target:
            schema: target_polar_estimate@1
        execution:
          mode: periodic
          period_ticks: 6
          deadline_ticks: 6
          budget_ms: 6
        dependencies: []
        state_version: '1'
    target_source: tracking
    managed_files:
    - tankbot.json
    - robot_modules/observations.py
    - contracts/tracking.json
    - tests/test_polar_contract.py
    mode: graph
    profile_id: weapons_polar
    logical_module:
      module_id: perception
      entry_point: campaign_robot:CampaignRobot
    processing: modules
permissions:
  data_access:
    inputs:
      /robot/localization/pose: pose2d@1
      /robot/sensors/radar: radar@1
      /robot/turret/joint_states: joint_state@1
      /robot/weapons/cannon/state: weapon_state@1
    outputs:
    - target_polar_estimate@1
    actuators: {}
  visualization:
    view_policy:
      policy_id: campaign-c3
      system_pose_allowed: true
      player_pose_allowed: false
      allowed_pose_frames:
      - map
      public_map: m1-test-map
      local_observation_channels:
      - /robot/sensors/joint_states
      - /robot/sensors/imu
      - /robot/turret/joint_states
      - /robot/weapons/cannon/state
      - /robot/sensors/radar
      true_enemy_objects: false
      world_effects: true
      camera_source: selected_pose_or_manual
      pose_fresh_ticks: 12
      pose_hide_after_ticks: 60
      robot_topics_allowed: true
      target_estimates_allowed: true
    allowed_layers:
    - map
    - robot
    - trail
    - target_estimates
    - radar
    - imu
    - encoders
    - turret
    - projectiles
    - frames
  public_initial_pose: true
  public_map: true
visualization:
  initial_enabled:
  - map
  - robot
  - trail
  - target_estimates
  - radar
  - imu
  - encoders
  - turret
  - projectiles
  user_toggleable:
  - map
  - robot
  - trail
  - target_estimates
  - radar
  - imu
  - encoders
  - turret
  - projectiles
  - frames
  sources:
    map: map
    robot: selected_pose
    trail: selected_pose
    target_estimates: player_estimate
    radar: local_observation
    imu: local_observation
    encoders: local_observation
    turret: local_observation
    projectiles: authorized_truth
    frames: selected_pose
  preserve_user_settings: true
objectives:
  parameters:
    movement_m: 0.0
    turn_rad: 0.0
    required_hits: 0
    required_estimates: 0
  progress:
    moved:
      type: displacement
      parameter: movement_m
      sticky: true
    turned:
      type: heading_change
      parameter: turn_rad
      sticky: true
  success:
    type: compare
    metric: target_alive
    operator: ==
    value: false
  outcomes:
  - reason: player_dead
    result: failure
    when:
      type: compare
      metric: player_alive
      operator: ==
      value: false
  - reason: objective_completed
    result: success
    when:
      type: all
      conditions:
      - type: compare
        metric: objective_complete
        operator: ==
        value: true
      - type: compare
        metric: elapsed_ticks
        operator: <=
        parameter: limit_ticks
  - reason: timeout
    result: failure
    when:
      type: compare
      metric: elapsed_ticks
      operator: '>='
      parameter: limit_ticks
  time_limit_s: 120
  timer_start: first_deployment
  target: patrol_enemy
evaluation:
  type: terminal_diagnostics
  publish_on: terminal
  metrics:
  - id: rmse_m
    type: position_rmse
  - id: yaw_rmse_rad
    type: yaw_rmse
randomization:
  seed: 0
  reset_on: new_run
  generator: python_random_v1
tutorial:
  problem: 雷达直接提供车体系 (r,theta)。处理非线性观测并输出车体系极坐标估计，人工瞄准击杀敌车。
  hints:
  - 从线性位置观测进阶到距离/方位观测；内部模型可使用 EKF，对外仍返回 (r,theta)。
  - F2 文件树高亮本关主要编辑文件；已有 perception/、weapons/ 源码和历史版本保留。
  - 运行中主界面可看日志，修改前请结束或重置本次尝试。
  lesson:
    title: C3 · 直接处理距离与方位观测
    summary: 从线性位置观测进阶到距离/方位观测；内部模型可使用 EKF，对外仍返回 (r,theta)。
    steps:
    - 底盘锁定，自身位姿由系统提供。阅读本关高亮文件的带类型签名、输入参考系、单位及返回约定。
    - 从 measurements 元组逐项读取 .range_m/.bearing_rad，框架不会先调用 C1 的坐标变换。内部可用笛卡尔运动状态和非线性观测模型构建
      EKF，输出仍是车体系极坐标。
    - 推导观测 Jacobian，并对 theta 创新做角度环绕。比较预测、测量和滤波结果；丢失时只做预测。
    - 保存、测试、部署，按 J/L 与空格人工控制炮台和开火，存活击杀。
    files:
    - path: perception/polar_tracker.py
      role: 本关填写：原始极坐标观测滤波，返回车体系 (r,theta)。
    default_type: PolarTargetEstimate
    functions:
    - path: perception/polar_tracker.py
      name: update
    aliases:
      own_pose: ndarray
      measurements: tuple[PolarTargetEstimate, ...]
    completion: 首次成功部署后计时，限时 {time_limit_s} 仿真秒，双方 {max_hp} HP。存活并击杀敌车通关；玩家死亡或超时失败，主动结束后可编辑。运行中不公开目标真值误差。
    common_errors:
    - 不要把 range/bearing 当作地图 x/y；角度创新须归一到 [-pi,pi)。
    - 观测元组只有当前帧，不是历史；需要保留状态或窗口时必须限制大小。
    - 运行阶段不能打开编辑器；请先结束本次尝试，修改保存后重试。
    - 输入是 tuple[PolarTargetEstimate, ...]：用 .range_m/.bearing_rad 取值，空帧为 ()；不要使用旧
      measurements_rt 的二维下标。
    execution: 框架以 {algorithm_hz} Hz 提供同期 tuple[PolarTargetEstimate, ...] 观测。Radar
      距离 σ={range_stddev_m:g} m、方位 σ={bearing_stddev_rad:g} rad、独立丢失 {drop_probability:.0%}；dt
      是仿真秒。空元组 () 为当前帧缺测，内部状态跨调用保存，部署或重试重新初始化。
    calibration:
      radar_measurement_covariance:
        source: radar_covariance
    type_notes:
      PolarTargetEstimate:
        description: C3/C4 复用的车体系距离/方位值类型：输入 tuple 中是当前原始带噪测量，函数返回值是玩家滤波/预测后的估计。
        fields:
          range_m: 距离，float，m，非负；输入为测量，输出为估计。
          bearing_rad: 相对当前我方车头的方位，float，rad，范围 [-pi,pi)。
          covariance: 输入为 None；输出为 None 或只读 (2,2) NumPy 协方差，顺序 r/theta。
    ui:
      state_heading: 02 / AUTHORIZED SELF POSE
      legend_pose: 系统自定位
      view_note: 系统提供自身位姿和可见炮弹；敌车位置来自 Python 的估计。雷达图仅显示车体系观测。炮弹图层可在设置中切换。
      mode_label: 教学视图 · 系统自定位 / 玩家目标估计
      freshness_message: 系统提供自身位姿和可见炮弹；敌车只有玩家目标估计
      progress_layout: health
      default_file: perception/polar_tracker.py
    edit_files:
    - perception/polar_tracker.py
  testing:
    checks:
    - Python 语法与导入；项目接口、连线和发布权限。
    - tests/test_*.py 中的项目单元测试；默认检查空观测、类型与基本数值契约，可自行补充算法样例。
    - 使用获授权传感器输入试运行 {test_batches} 个批次，检查异常、超时和输出消息。
    meaning: 通过表示此快照可以加载并通过这些样例和短时间试运行，不代表算法效果完美或关卡通关。测试输出不会控制坦克，也不会进入正式画面。
scaffolding:
  components:
  - polar_tracker
  - raw_sensor_adapters
  - polar_contract_tests
  documentation:
    perception/polar_tracker.py:
    - function: update
      text: '输入 measurements: tuple[PolarTargetEstimate, ...]，当前帧敌车中心的原始极坐标观测集合，当前长度为
        0 或 1；缺测为 ()，不是 NumPy 数组，也不是历史缓存。与 C2 的 tuple[TargetEstimate, ...] 结构相同，字段改为距离和方位。

        每个 measurement 的 range_m: float 为距离（m），bearing_rad: float 为相对我方车头的方位（rad），均在当前我方
        base_link；输入 covariance 为 None，measurement_covariance 构造参数仍提供 YAML 中的 (2,2)
        测量噪声矩阵。输入对象复用 PolarTargetEstimate 类型，但仍是未滤波的雷达观测，不是系统替你计算的估计。

        own_pose: shape=(3,) 的公开自身 [x_m,y_m,yaw_rad] NumPy 数组；dt: float 为仿真秒。

        返回 PolarTargetEstimate(range_m: float,bearing_rad: float,covariance=None)
        或 None。输出仍在当前车体系，bearing 归一到 [-pi,pi)，covariance 为 None 或 (2,2) NumPy 矩阵，顺序
        r/theta。

        读取示例：measurement: PolarTargetEstimate = measurements[0]；r: float = measurement.range_m；theta:
        float = measurement.bearing_rad。读取前先判断 if measurements，缺测时可以只预测。

        内部可以保存 NumPy 状态 [x,y,vx,vy]，观测模型使用 hypot/atan2，推导 Jacobian、环绕角度创新并更新协方差；框架不先转换为地图
        x/y，不强制唯一算法。

        从旧数组接口迁移：将原来的 measurements_rt[0,0] / measurements_rt[0,1] 改为 measurements[0].range_m
        / measurements[0].bearing_rad。如需矩阵，可自行使用 np.array([[m.range_m,m.bearing_rad]
        for m in measurements],dtype=np.float64).reshape((-1,2))。升级只更新管理脚手架，已有算法文件不覆盖；请按新签名自行适配后重新测试。'
