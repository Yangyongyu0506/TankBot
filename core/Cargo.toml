[package]
name = "tankbot-core"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rapier2d-f64 = { version = "=0.36.1", features = ["enhanced-determinism", "serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
