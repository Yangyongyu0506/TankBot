config_version: '2.0'
confirmation_status: confirmed
body:
  mass_kg: 20.0
  yaw_inertia_kg_m2: 2.0
servo:
  tau_x_s: 0.2
  tau_y_s: 0.2
  tau_yaw_s: 0.15
  max_force_x_n: 100.0
  max_force_y_n: 100.0
  max_torque_nm: 20.0
  zero_target_behavior: active_brake
motion_limits:
  max_vx_mps: 3.0
  max_vy_mps: 3.0
  max_wz_radps: 6.0
chassis:
  differential:
    lateral_actuation: false
    drag_x_n_s_per_m: 4.0
    drag_y_n_s_per_m: 200.0
    drag_yaw_nm_s: 0.8
  omnidirectional:
    lateral_actuation: true
    drag_x_n_s_per_m: 4.0
    drag_y_n_s_per_m: 4.0
    drag_yaw_nm_s: 0.8
clock:
  physics_hz: 60
  substeps: 4
  sensor_hz: 30
  algorithm_hz: 10
contact:
  restitution: 0.0
  friction: 0.4
wheels:
  radius_m: 0.1
  differential_track_m: 0.5
  omnidirectional:
    geometry_version: radial_omni@1
    center_radius_m: 0.25
    wheels:
    - name: front_left
      azimuth_deg: 45.0
    - name: front_right
      azimuth_deg: 315.0
    - name: rear_left
      azimuth_deg: 135.0
    - name: rear_right
      azimuth_deg: 225.0
sensors:
  imu_mount: center_of_mass
  imu_axes: base_link
  planar_gravity_mps2: 0.0
  noise_stddev: 0.0
  bias: 0.0
  drift_per_s: 0.0
  latency_ticks: 0
  drop_probability: 0.0
  encoder_model: ideal_rolling
controller:
  cmd_vel_timeout_s: 0.5
  overspeed_target: clamp_each_axis
  unsupported_lateral: reject
scene:
  default_chassis: differential
  initial_pose:
  - 0.0
  - 0.0
  - 0.0
  initial_velocity:
  - 0.0
  - 0.0
  - 0.0
  public_initial_pose: true
  public_map: true
  walls:
  - center:
    - 6.1
    - 0.0
    size:
    - 0.2
    - 8.4
  - center:
    - -6.1
    - 0.0
    size:
    - 0.2
    - 8.4
  - center:
    - 0.0
    - 4.1
    size:
    - 12.0
    - 0.2
  - center:
    - 0.0
    - -4.1
    size:
    - 12.0
    - 0.2
  - center:
    - 2.0
    - 0.0
    size:
    - 0.2
    - 3.0
  player_health: null
runtime:
  commit_delay_ticks: 6
  batch_budget_ms: 20
  startup_timeout_s: 5.0
  max_message_bytes: 262144
  max_failures: 3
  input_max_age_ticks: 12
  max_log_bytes: 32768
  seed: 0
  history_limit_ticks: 36000
  audit_limit_entries: 4096
  max_cmd_vel_per_sim_second: 60
  max_inbound_per_wall_second: 512
  estimate_history_ticks: 60
view_policy:
  policy_id: m1-estimates-only
  system_pose_allowed: false
  player_pose_allowed: true
  allowed_pose_frames:
  - map
  public_map: m1-test-map
  local_observation_channels:
  - /robot/sensors/joint_states
  - /robot/sensors/imu
  - /robot/turret/joint_states
  - /robot/weapons/cannon/state
  true_enemy_objects: false
  world_effects: false
  camera_source: selected_pose_or_manual
  pose_fresh_ticks: 12
  pose_hide_after_ticks: 60
view:
  pose_source_id: odometry
  snapshot_hz: 30
  max_visual_trail: 300
  poll_ms: 33
  keyboard_refresh_ms: 100
  keyboard_linear_mps: 1.0
  keyboard_yaw_radps: 1.0
  interpolation_jump_m: 1.0
  keyboard_turret_radps: 2.0
  gamepad:
    enabled: true
    standard_mapping_only: true
    deadzone: 0.18
    button_threshold: 0.5
    refresh_ms: 50
    linear_mps: 1.0
    yaw_radps: 1.0
    turret_radps: 2.0
    axes:
      forward:
        index: 1
        sign: -1
      horizontal:
        index: 0
        sign: -1
      turret:
        index: 2
        sign: -1
    buttons:
      yaw_left: 4
      yaw_right: 5
      fire: 7
      editor: 9
host:
  bind: 127.0.0.1
  port: 8765
  max_catchup_ticks: 5
validation:
  ticks: 600
  probe_target:
  - 0.5
  - 0.0
  - 0.0
  pose_offset_m: 2.0
  covariance_tolerance: 1.0e-09
  numeric_tolerance: 1.0e-08
  contact_measurement_tolerance_m: 0.005
  odom_error_tolerance_m: 0.1
  covariance_max_iterations: 64
  reference_aim:
    kp: 18.0
    kd: 8.0
    fire_tolerance_rad: 0.035
    velocity_window_s: 1.5
    max_target_speed_mps: 1.2
    yaw_speed_threshold_mps: 0.15
    minimum_track_samples: 4
    maximum_track_samples: 40
    minimum_fit_span_s: 0.3
    armor_facing_cosine: 0.2
    yaw_alpha: 0.3
    initial_variance: 2.0
    process_acceleration_std: 1.0
    measurement_std_m: 0.5
    position_window_s: 1.5
    intercept_iterations: 3
    minimum_distance_squared: 0.01
    process_yaw_acceleration_std: 3.0
    yaw_window_s: 0.5
    manual_aim_gain_per_s: 4.0
    manual_aim_rate_radps: 2.0
solver:
  dt: 0.004166666666666667
  min_ccd_dt: 0.00016666666666666666
  contact_softness:
    natural_frequency: 30.0
    damping_ratio: 10.0
  static_contact_softness:
    natural_frequency: 60.0
    damping_ratio: 10.0
  warmstart_coefficient: 1.0
  length_unit: 1.0
  soft_bodies:
    recovery:
      authored_velocity_margin: true
      edge_speculation: false
      inverted_cell_detection: true
      self_crossing_detection: true
      detection_motion_gating: true
      cross_body_detection: true
      self_stand_down: true
      cross_body_expel_gate: true
      edge_stand_down: true
      crossing_repulsion: false
      crossing_repulsion_guide: false
      crossing_repulsion_self_guide: false
      recovery_pace: 0.5
      overlap_constraints: true
      overlap_rigid: true
      overlap_skip_self_tangled: true
      overlap_edge_stand_down: true
      overlap_constraint_pace: 1.0
      overlap_patch_constraints: AlongNormal
      overlap_skin_volume: false
      overlap_kept_depth: 0.0
      overlap_self_regions: false
      overlap_normal_push: true
      overlap_multi_volume: false
      overlap_split: 3
      overlap_patience: 240
      overlap_progress_margin: 0.02
    resweep_strain: 0.75
    max_extra_substeps: 4
    contact_stiffening: 4.0
  normalized_allowed_linear_error: 0.001
  normalized_max_corrective_velocity: 3.0
  normalized_prediction_distance: 0.02
  normalized_max_linear_velocity: 400.0
  num_solver_iterations: 8
  num_internal_pgs_iterations: 4
  num_internal_stabilization_iterations: 1
  max_ccd_substeps: 1
  contact_clustering: true
  contact_recycling: true
  normalized_contact_recycle_distance: 0.05
  friction_in_bias_pass: false
  warmstart_joints: false
rigid_body:
  ccd_enabled: true
  can_sleep: false
  linear_damping: 0.0
  angular_damping: 0.0
module:
  module_id: odometry
  entry_point: localization.odometry:Odometry
  pose_offset_m: 0.0
  output_frame: map
  fault: none
  weapon_demo:
    enabled: false
    turret_velocity_radps: 2.0
    fire_period_ticks: 18
weapons:
  turret:
    mass_kg: 2.0
    yaw_inertia_kg_m2: 0.08
    center_m:
    - 0.0
    - 0.0
    tau_s: 0.1
    max_torque_nm: 2.0
    max_relative_rate_radps: 8.0
    bearing_drag_nm_s: 0.02
    muzzle_offset_m:
    - 0.45
    - 0.0
    initial_relative_angle_rad: 0.0
    initial_relative_rate_radps: 0.0
    cmd_vel_timeout_s: 0.5
    acceleration_control:
      max_relative_acceleration_radps2: 25.0
      timeout_s: 0.5
      rate_limit_braking_tau_s: 0.1
  projectile:
    mass_kg: 0.05
    radius_m: 0.03
    relative_speed_mps: 5.0
    wall_restitution: 1.0
    wall_friction: 0.0
    max_bounces: 3
    lifetime_s: 5.0
  mass_accounting: fixed_chassis_mass
  enabled: true
  firing:
    cooldown_s: 0.25
    trigger: single
    ammunition: unlimited
    request_cache_capacity: 65536
    pending_capacity: 64
    max_active_projectiles: 64
  numerics:
    time_epsilon_s: 1.0e-09
    spatial_epsilon_m: 1.0e-06
  impact:
    momentum: world_velocity
    application_body: chassis
    application_point: contact_or_muzzle
    direction_rule: chassis_capability
    timing: substep_end
  targets:
  - target_id: target_01
    pose:
    - -3.0
    - 0.0
    - 0.0
  collision:
    owner_immunity: until_exit
    projectile_pair: destroy_both
    simultaneous_pairs: destroy_contact_graph
    priority: target_pair_wall
    wall_order: stable_id
    blocked_muzzle: reject_without_recoil_or_cooldown
control_sources:
  chassis: keyboard
  turret: keyboard
  weapon: keyboard
view_mode: estimated
practice_view_policy:
  policy_id: m1b-weapons-practice
  system_pose_allowed: true
  player_pose_allowed: false
  allowed_pose_frames:
  - map
  public_map: m1-test-map
  local_observation_channels:
  - /robot/sensors/joint_states
  - /robot/sensors/imu
  - /robot/turret/joint_states
  - /robot/weapons/cannon/state
  true_enemy_objects: false
  world_effects: true
  camera_source: selected_pose_or_manual
  pose_fresh_ticks: 12
  pose_hide_after_ticks: 60
rendering:
  viewport_width_m: 12.0
  grid_spacing_m: 1.0
  camera_origin_m:
  - 0.0
  - 0.0
  interpolation_delay_ms: 80
  estimate_interpolation_delay_ms: 220
  history_ms: 2000
  stats_interval_ms: 1000
  barrel_width_m: 0.035
browser:
  runtime_port: 8766
  startup_timeout_s: 45
  max_pending_requests: 16
  probe_enabled: false
workspace:
  storage:
    directory: userdata/workspaces
    legacy_directory: .m1-cache/workspaces
  max_files: 64
  max_source_bytes: 65536
  max_plans: 16
  test_batches: 6
  max_deployments: 32
  poll_ms: 500
  max_archives: 128
robot_graph:
  max_modules: 8
  max_connections: 64
  schemas:
    armor_detections@1:
    - base_link
    gps_fix@1:
    - map
    target_polar_estimate@1:
    - base_link
    pose2d@1:
    - map
    target_estimate@1:
    - map
    target_points@1:
    - map
    joint_state@1:
    - base_link
    imu@1:
    - base_link
    radar@1:
    - radar_link
    weapon_state@1:
    - base_link
    twist@1:
    - base_link
    turret_velocity@1:
    - base_link
    fire_command@1:
    - null
    turret_acceleration@1:
    - base_link
    target_pose_estimate@1:
    - map
  internal_schemas:
  - target_polar_estimate@1
  - pose2d@1
  - target_estimate@1
  - target_points@1
  - twist@1
  - target_pose_estimate@1
  profiles: {}
  max_batch_outputs: 128
  max_view_topic_bytes: 32768
level_plugins:
  directory: levels
  limits:
    max_files: 128
    max_file_bytes: 131072
    max_depth: 32
    max_nodes: 20000
    max_robots: 16
    max_sensors: 16
  planned_chapters:
  - chapter_id: locomotion
    title: Locomotion
    description: 后续章节：底盘驱动、运动控制、自身状态估计，再逐步引入定位与建图。
    levels: []
chassis_profiles:
  differential: config/chassis/differential.yaml
  omnidirectional: config/chassis/omnidirectional.yaml
