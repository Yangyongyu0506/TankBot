name: Cross-platform builds and Linux regression
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Cross-platform native and WASM build checks (not a player-flow certification)
        run: |
          cargo +1.99.1 fmt --all --check
          cargo +1.99.1 build --locked
          cargo +1.99.1 build --locked --release --target wasm32-unknown-unknown --lib
          cargo +1.99.1 test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build editor from locked npm dependencies
        run: python tools/build.py --web-only
      - name: Shared local/CI regression entry
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements.txt
          python tools/check.py
      - name: Built native/WASM equivalence (separate from browser UI)
        if: runner.os == 'Linux'
        run: npm run test:wasm
