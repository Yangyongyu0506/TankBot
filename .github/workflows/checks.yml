name: Design and core checks
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Native and WASM build
        run: |
          cargo +1.99.1 fmt --all --check
          cargo +1.99.1 build --locked
          cargo +1.99.1 build --locked --release --target wasm32-unknown-unknown --lib
          cargo +1.99.1 test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build editor from locked npm dependencies
        run: python tools/build.py --web-only
      - name: Protocol, runtime, rendering and documentation
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node tests/test_rendering.mjs
          node tests/test_sdk_hints.mjs
          node tests/test_wasm.mjs
          python docs/tools/check_design.py
